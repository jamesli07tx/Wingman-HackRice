# INTEGRATION(X-MACHINE):
# COUNTERPART: glassbridge/Config.local.xcconfig (CORTEX_URL / CORTEX_WS_URL)
# CONTRACT: DESIGN_WINDOWS.md §0.6 integration-day sequence
# AT-INTEGRATION: hand the human https://wingman-cortex.fly.dev and
#   wss://wingman-cortex.fly.dev — keep them stable after M1.

app = "wingman-cortex"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Long-lived device WebSockets: the machine must NOT scale to zero mid-demo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
